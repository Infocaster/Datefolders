trigger:
  branches:
    include:
    - v10/main
    - v10/develop
    - v10/release/*
    - v10/hotfix
  tags:
    include:
    - 10.*

pool:
  name: Default

variables: 
  BuildConfiguration: 'release'
  BuildPlatform: 'any cpu'
  Solution: '**\*.sln'
  npmWorkingDirectory: 'src\Infocaster.UmbracoAwesome.NodeNameSync'

stages:
- stage: build
  displayName: Build
  jobs:
  - job: build
    displayName: Build
    steps:
    - task: NodeTool@0
      displayName: 'Use node 20.x'
      inputs:
        versionSpec: '20.x'

    - task: Npm@1
      displayName: 'Install front end packages'
      inputs:
        command: 'custom'
        workingDir: $(npmWorkingDirectory)
        customCommand: 'ci --prefer-online --no-audit'
        verbose:

    - task: Npm@1
      displayName: 'Build front end'
      inputs:
        command: 'custom'
        workingDir: $(npmWorkingDirectory)
        customCommand: 'run build'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet restore'
      inputs:
        command: restore
        feedsToUse: config
        nugetConfigPath: nuget.config

    - task: gittools.gitversion.gitversion-task.GitVersion@5
      displayName: GitVersion
      inputs:
        configFilePath: GitVersion.yml
        updateAssemblyInfo: true

    - task: DotNetCoreCLI@2
      displayName: 'dotnet build'
      inputs:
        projects: src/Infocaster.UmbracoAwesome.NodeNameSync/NodeNameSync.csproj
        arguments: '--configuration $(BuildConfiguration)  /p:Version=$(GitVersion.NuGetVersion)'
        versioningScheme: byBuildNumber

    - task: DotNetCoreCLI@2
      displayName: 'dotnet pack'
      inputs:
        command: pack
        packagesToPack: src/**/*.csproj
        nobuild: false
        versioningScheme: byEnvVar
        versionEnvVar: GitVersion.NuGetVersion

    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        PathtoPublish: '$(build.artifactstagingdirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: release
  displayName: Release
  dependsOn: build
  condition: and(succeeded(), or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), in(variables['build.sourcebranch'], 'refs/heads/v10/develop')))
  jobs:
  - job: release
    displayName: Push to artifacts
    workspace:
      clean: all
    steps:
    - checkout: none
    
    - download: current
      patterns: '**/*.nupkg'
      displayName: Download build artifact
    
    - task: DotNetCoreCLI@2
      displayName: 'dotnet push'
      inputs:
        command: push
        publishVstsFeed: '3356baca-d7d8-497c-a5fa-ebd93f79f7c7'
        versioningScheme: byBuildNumber
        packagesToPush: '$(Pipeline.Workspace)/**/Infocaster.Umbraco.NodeNameSync*.nupkg'