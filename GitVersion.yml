mode: ContinuousDeployment
branches:
  feature:
    tag: alpha
    regex: ^v18/feature/
    source-branches: ['v18/develop']
  develop:
    tag: beta
    regex: ^v18/develop$
  master:
    tag: ''
    regex: ^v18/main$
  hotfix:
    tag: 'beta'
    regex: ^v18/hotfix
    source-branches: ['v18/main']
ignore:
  sha: []